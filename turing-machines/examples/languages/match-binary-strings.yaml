# equal strings
# Ported from the turingmachine.io example matchBinaryStrings:
# https://github.com/aepsilon/turing-machine-viz/blob/master/src/examples/matchBinaryStrings.yaml
# Copyright 2015-2021 Andy Li, BSD 3-Clause license, see ../LICENSE-turingmachine-io.
# The blank ' ' is written as _ here.
# Example input: 01001#01001 (try '#', '1#10', '10#1', '10#10')

# Decides the language { w#w | w ∈ {0,1}* }
# (two equal binary strings separated by '#')
# Two strings are equal if they are both the empty string,
# or they start with the same symbol and are equal thereafter.

# equal strings
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: accept. All other stops reject.
input: '01001#01001'
blank: ' '
start state: start
table:
  start:
    # Inductive case: start with the same symbol.
    '0': {write: ' ', R: have0}
    '1': {write: ' ', R: have1}
    # Base case: empty string.
    '#': {R: check}
  have0:
    '0': R
    '1': R
    '#': {R: match0}
  have1:
    '0': R
    '1': R
    '#': {R: match1}
  check:
    'x': R
    ' ': {R: accept}
  match0:
    'x': R
    '0': {write: 'x', L: back}
  match1:
    'x': R
    '1': {write: 'x', L: back}
  back:
    '0': L
    '1': L
    '#': L
    'x': L
    ' ': {R: start}
  accept:
