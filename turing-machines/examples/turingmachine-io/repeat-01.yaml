# repeat 0 1
# Ported from the turingmachine.io example repeat01 by Andy Li (BSD 3-Clause license):
# https://github.com/aepsilon/turing-machine-viz/blob/master/src/examples/repeat01.yaml
# The blank ' ' is written as _ here.
# Example input: none, start with an empty tape.

# This is the first example machine given by Alan Turing in his 1936 paper
# "On Computable Numbers, with an Application to
# the Entscheidungsproblem".
# It simply writes the endless sequence 0 1 0 1 0 1...

# repeat 0 1
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# This machine never stops.
input: ''
blank: ' '
start state: b
table:
  b:
    ' ': {write: '0', R: c}
  c:
    ' ': {R: e}
  e:
    ' ': {write: '1', R: f}
  f:
    ' ': {R: b}
