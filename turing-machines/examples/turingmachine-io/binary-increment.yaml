# binary increment
# Ported from the turingmachine.io example binaryIncrement:
# https://github.com/aepsilon/turing-machine-viz/blob/master/src/examples/binaryIncrement.yaml
# Copyright 2015-2021 Andy Li, BSD 3-Clause license, see LICENSE.
# The blank ' ' is written as _ here.
# Example input: 1011

# Adds 1 to a binary number.

# binary increment
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: done. All other stops reject.
input: '1011'
blank: ' '
start state: right
table:
  right:
    # scan to the rightmost digit
    '1': R
    '0': R
    ' ': {L: carry}
  carry:
    # then carry the 1
    '1': {write: '0', L}
    '0': {write: '1', L: done}
    ' ': {write: '1', L: done}
  done:
