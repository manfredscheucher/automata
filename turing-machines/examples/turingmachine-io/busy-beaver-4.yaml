# 4-state busy beaver
# Ported from the turingmachine.io example busyBeaver4
# by Andy Li, https://github.com/aepsilon/turing-machine-viz (BSD 3-Clause, see LICENSE).
# The blank '0' is written as _ here.
# Example input: none, start with an empty tape.

# A 4-state 2-symbol busy beaver
# that halts after 107 steps, leaving 13 1's on the tape.
# It takes the most steps *and* prints the most 1's.

# 4-state busy beaver
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: H. All other stops reject.
input: ''
blank: ' '
start state: A
table:
  A:
    ' ': {write: '1', R: B}
    '1': {L: B}
  B:
    ' ': {write: '1', L: A}
    '1': {write: ' ', L: C}
  C:
    ' ': {write: '1', R: H}
    '1': {L: D}
  H:
  D:
    ' ': {write: '1', R}
    '1': {write: ' ', R: A}
