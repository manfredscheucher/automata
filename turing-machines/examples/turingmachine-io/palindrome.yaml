# palindrome
# Ported from the turingmachine.io example palindrome by Andy Li (BSD 3-Clause):
# https://github.com/aepsilon/turing-machine-viz/blob/master/src/examples/palindrome.yaml
# The blank ' ' is written as _ here.
# Example input: abba (try a, ab, bb, babab)

# Accepts palindromes made of the symbols 'a' and 'b'
# A palindrome is either the empty string, a single symbol,
# or a (shorter) palindrome with the same symbol added to both ends.

# palindrome
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: accept. All other stops reject.
input: 'abba'
blank: ' '
start state: start
table:
  start:
    'a': {write: ' ', R: haveA}
    'b': {write: ' ', R: haveB}
    # empty string
    ' ': {R: accept}
  haveA:
    'a': R
    'b': R
    ' ': {L: matchA}
  haveB:
    'a': R
    'b': R
    ' ': {L: matchB}
  accept:
  matchA:
    # same symbol at both ends
    'a': {write: ' ', L: back}
    'b': {R: reject}
    # single symbol
    ' ': {R: accept}
  matchB:
    'a': {R: reject}
    # same symbol at both ends
    'b': {write: ' ', L: back}
    # single symbol
    ' ': {R: accept}
  back:
    'a': L
    'b': L
    ' ': {R: start}
  reject:
