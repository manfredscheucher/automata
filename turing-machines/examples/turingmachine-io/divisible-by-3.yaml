# divisible by 3
# Ported from the turingmachine.io example divisibleBy3:
# https://github.com/aepsilon/turing-machine-viz/blob/master/src/examples/divisibleBy3.yaml
# Copyright 2015-2021 Andy Li, BSD 3-Clause license, see LICENSE.
# The blank ' ' is written as _ here.
# Example input: 1001 (try '1111' (15), '10100' (20), '111001' (57))

# Checks if a binary number is divisible by 3.
# How it works:

# Consider reading a binary number, say 10011 (19),
# from left to right one digit at a time.
# Each time a digit is read, the new value equals the new digit
# plus the old value shifted left one place (multiplied by 2).

# Digits  Value
# -------------
# 0
# 1       1
# 10      2
# 100     4
# 1001    9
# 10011   19

# Now instead of tracking the entire number, just track the remainder.
# It works the same way.

# divisible by 3
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: accept. All other stops reject.
input: '1001'
blank: ' '
start state: q0
table:
  q0:
    # 2*0 + 0 = 0
    '0': R
    # 2*0 + 1 = 1
    '1': {R: q1}
    ' ': {R: accept}
  q1:
    # 2*1 + 0 = 2
    '0': {R: q2}
    # 2*1 + 1 = 3
    '1': {R: q0}
  accept:
  q2:
    # 2*2 + 0 = 4
    '0': {R: q1}
    # 2*2 + 1 = 5
    '1': R
