# Author: Gabriel Alvarez
# Simulator: https://turingmachinesimulator.com
# Initial state: qinit
# Accepting state: qfin
# Whole alphabet: 0,1,o,i

# Comments: We duplicate the size of
# a binary string by concatenating
# the string to its mirror image.
# i/o will be used as "markers" for
# the squares with 1's and 0's
# (respectively).

# Modified 2026 by Manfred Scheucher: generalized from 0,1 to 0 to 9
# (markers o,i,j,k for 0 to 3 and a,b,c,d,e,f for 4 to 9), and removed rules that never run
# (qinit on markers, removing_the_markers on digits).

# Build palindrome, symbols 0 to 9
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: qfin. All other stops reject.
input: '0123456789'
blank: ' '
start state: qinit
table:
  qinit:
    '0': R
    '1': R
    '2': R
    '3': R
    '4': R
    '5': R
    '6': R
    '7': R
    '8': R
    '9': R
    ' ': {L: copying_from_right_to_left}
  copying_from_right_to_left:
    # We place a marker (o, i, j, ...) over the
    # first number found. We ignore the
    # squares already marked
    '0': {write: 'o', R: copying_0_to_the_right}
    '1': {write: 'i', R: copying_1_to_the_right}
    '2': {write: 'j', R: copying_2_to_the_right}
    '3': {write: 'k', R: copying_3_to_the_right}
    '4': {write: 'a', R: copying_4_to_the_right}
    '5': {write: 'b', R: copying_5_to_the_right}
    '6': {write: 'c', R: copying_6_to_the_right}
    '7': {write: 'd', R: copying_7_to_the_right}
    '8': {write: 'e', R: copying_8_to_the_right}
    '9': {write: 'f', R: copying_9_to_the_right}
    'o': L
    'i': L
    'j': L
    'k': L
    'a': L
    'b': L
    'c': L
    'd': L
    'e': L
    'f': L
    # When we finished copying the whole
    # string --> it's time to remove the
    # markers
    ' ': {R: removing_the_markers}
  copying_0_to_the_right:
    # If we find a blank square -->
    # we copy our value (marked) and
    # come back
    ' ': {write: 'o', L: copying_from_right_to_left}
    # If we find a non-blank square -->
    # we ignore it and keep moving right
    '0': R
    '1': R
    '2': R
    '3': R
    '4': R
    '5': R
    '6': R
    '7': R
    '8': R
    '9': R
    'o': R
    'i': R
    'j': R
    'k': R
    'a': R
    'b': R
    'c': R
    'd': R
    'e': R
    'f': R
  copying_1_to_the_right:
    ' ': {write: 'i', L: copying_from_right_to_left}
    '0': R
    '1': R
    '2': R
    '3': R
    '4': R
    '5': R
    '6': R
    '7': R
    '8': R
    '9': R
    'o': R
    'i': R
    'j': R
    'k': R
    'a': R
