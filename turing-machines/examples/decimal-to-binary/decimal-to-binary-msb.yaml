# Original: "Decimal to binary" example on turingmachinesimulator.com.
# The original turns a decimal number (most significant digit on the left)
# into a binary number with the least significant bit on the left: 13 -> 1011.
# Modified 2026 by Manfred Scheucher: the binary number has its most
# significant bit on the left, like the decimal input: 13 -> 1101.
# How: only the rules setrest0,1 and setrest1,0 are changed. Each new bit goes
# in front of the others, and the others move one cell to the right.
# Like the original, this version is under CC BY-NC-SA 3.0.

# Decimal to binary
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: qfin. All other stops reject.
input: '13'
blank: ' '
start state: qinit
table:
  qinit:
    '0': R
    '1': R
    '2': R
    '3': R
    '4': R
    '5': R
    '6': R
    '7': R
    '8': R
    '9': R
    ' ': {write: '0', L: halve}
  halve:
    # Halve and go to addHalf to add the goBack
    '0': L
    '1': {write: '0', R: addHalf}
    '2': {write: '1', L}
    '3': {write: '1', R: addHalf}
    '4': {write: '2', L}
    '5': {write: '2', R: addHalf}
    '6': {write: '3', L}
    '7': {write: '3', R: addHalf}
    '8': {write: '4', L}
    '9': {write: '4', R: addHalf}
    # If we halved successfully, we first remove the zero if there is one and then we go back
    ' ': {R: removezero}
  addHalf:
    # Add 0.5 to the right
    '0': {write: '5', L: jump}
    '1': {write: '6', L: jump}
    '2': {write: '7', L: jump}
    '3': {write: '8', L: jump}
    '4': {write: '9', L: jump}
  jump:
    # Jump back
    '0': {L: halve}
    '1': {L: halve}
    '2': {L: halve}
    '3': {L: halve}
    '4': {L: halve}
  removezero:
    '0': {write: ' ', R}
    '1': {R: goBack}
    '2': {R: goBack}
    '3': {R: goBack}
    '4': {R: goBack}
    '5': {R: goBack}
    '6': {R: goBack}
    '7': {R: goBack}
    '8': {R: goBack}
    '9': {R: goBack}
    # qfinished
    ' ': {R: qfin}
  goBack:
    # normal goBack
    '0': R
    '1': R
    '2': R
    '3': R
    '4': R
    '5': R
    '6': R
    '7': R
    '8': R
    '9': R
    # rest
    ' ': {L: rest}
  qfin:
  rest:
    '0': {write: ' ', R: rest0}
    '5': {write: ' ', R: rest1}
  rest0:
    ' ': {R: setrest0}
  setrest0:
    '0': R
    '1': {write: '0', R: setrest1}
    ' ': {write: '0', L: continue}
  rest1:
    ' ': {R: setrest1}
  setrest1:
    '0': {write: '1', R: setrest0}
    '1': R
    ' ': {write: '1', L: continue}
  continue:
    # continue
    '0': L
    '1': L
    ' ': {L: continue2}
  continue2:
    # delimiter
    ' ': {write: '0', L: halve}
