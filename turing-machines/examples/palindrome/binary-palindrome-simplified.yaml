# Input: a binary number n
# Output: accepts if n is a palindrome
# Example: accepts 10101

# Palindrome Algorithm
# for Turing Machine Simulator
# turingmachinesimulator.com

# Original: "Binary palindrome" example by Martin Ugarte (Copyleft 2017).
# Modified 2026 by Manfred Scheucher: no second phase, just walk back
# to the left end. Nearly half the states and rules (7 instead of 12 states,
# 16 instead of 30 rules), but nearly double the number of steps.

# Binary palindrome (Simplified)
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: qAccept. All other stops reject.
input: '11011'
blank: ' '
start state: q0
table:
  q0:
    '0': {write: ' ', R: qRight0}
    '1': {write: ' ', R: qRight1}
    ' ': {R: qAccept}
  qRight0:
    '0': R
    '1': R
    ' ': {L: qSearch0L}
  qRight1:
    '0': R
    '1': R
    ' ': {L: qSearch1L}
  qSearch0L:
    '0': {write: ' ', L: q1}
    ' ': {R: qAccept}
  q1:
    '0': L
    '1': L
    ' ': {R: q0}
  qSearch1L:
    '1': {write: ' ', L: q1}
    ' ': {R: qAccept}
  qAccept:
