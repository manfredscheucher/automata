# copy 1s
# Ported from the turingmachine.io example copy1s:
# https://github.com/aepsilon/turing-machine-viz/blob/master/src/examples/copy1s.yaml
# Copyright 2015-2021 Andy Li, BSD 3-Clause license, see ../LICENSE-turingmachine-io.
# The blank '0' is written as _ here.
# Example input: 111

# Copies a string of consecutive 1s.

# copy 1s
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: H. All other stops reject.
input: '111'
blank: ' '
start state: each
table:
  each:
    # mark the current 1 by erasing it
    ' ': {R: H}
    '1': {write: ' ', R: sep}
  H:
  sep:
    # skip to the separator
    ' ': {R: add}
    '1': R
  add:
    # skip to the end of the copy and write a 1
    ' ': {write: '1', L: sepL}
    '1': R
  sepL:
    # return to the separator
    ' ': {L: next}
    '1': L
  next:
    # return to the erased 1, restore it, and then advance to the next 1
    ' ': {write: '1', R: each}
    '1': L
