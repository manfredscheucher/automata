# divisible by 3 (base 10)
# Ported from the turingmachine.io example divisibleBy3Base10
# by Andy Li, https://github.com/aepsilon/turing-machine-viz (BSD 3-Clause, see LICENSE).
# The blank ' ' is written as _ here.
# Example input: 4728 (try 42, 57, 1337, 5328, 7521, 314159265)

# Checks if a base 10 number is divisible by 3.
# This uses the same idea as the base 2 version.

# To make things more interesting, we derive the step relation:
# Let x be the number left of the tape head,
# d the digit under the head, and
# x' the number up to and including the head.
# Then
# x' = 10x + d .
# Notice 10 ≡ 1 (mod 3). Therefore
# x' ≡ x + d (mod 3) .
# Each step simply adds the new digit's remainder mod 3.

# divisible by 3 (base 10)
# Converted from the turingmachinesimulator.com format with txt2yaml.py.
# Accepting states: accept. All other stops reject.
input: '4728'
blank: ' '
start state: q0
table:
  q0:
    # 0 + 0 ≡ 0 (mod 3)
    '0': R
    '3': R
    '6': R
    '9': R
    # 0 + 1 ≡ 1
    '1': {R: q1}
    '4': {R: q1}
    '7': {R: q1}
    # 0 + 2 ≡ 2
    '2': {R: q2}
    '5': {R: q2}
    '8': {R: q2}
    ' ': {R: accept}
  q1:
    # 1 + 0 ≡ 1
    '0': R
    '3': R
    '6': R
    '9': R
    # 1 + 1 ≡ 2
    '1': {R: q2}
    '4': {R: q2}
    '7': {R: q2}
    # 1 + 2 ≡ 0
    '2': {R: q0}
    '5': {R: q0}
    '8': {R: q0}
  q2:
    # 2 + 0 ≡ 2
    '0': R
    '3': R
    '6': R
    '9': R
    # 2 + 1 ≡ 0
    '1': {R: q0}
    '4': {R: q0}
    '7': {R: q0}
    # 2 + 2 ≡ 1
    '2': {R: q1}
    '5': {R: q1}
    '8': {R: q1}
  accept:
